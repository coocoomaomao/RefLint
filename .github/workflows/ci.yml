name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          reflint --help
          reflint check examples/bad-references.bib

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install ".[release]"
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/reflint-wheel-test
          /tmp/reflint-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/reflint-wheel-test/bin/reflint --help
          /tmp/reflint-wheel-test/bin/reflint check examples/good-references.bib
